# iPhone uygulamasını GitHub'ın macOS makinesinde (Xcode 26) derler. Mac'e gerek yok.
# Sırlar yoksa: imzasız simülatör derlemesi yapar (yerel kodun derlendiğini doğrular, telefona kurulmaz).
# Sırlar varsa: scripts/ios-imza.mjs ile Apple'da uygulama kimliği, dağıtım sertifikası ve App Store profili hazırlanır,
# imzalı IPA çıkar ve TestFlight'a yüklenir.
# Sırlar: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY (.p8 içeriği), IOS_DIST_KEY (dağıtım özel anahtarı, PEM)
name: iOS derleme
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-derleme
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_KEY }}
      IOS_DIST_KEY: ${{ secrets.IOS_DIST_KEY }}
      IOS_PROFILE_NAME: Kanka Chat App Store (CI)
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: İmzalı mı, imzasız mı
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY" ] && [ -n "$IOS_DIST_KEY" ]; then
            echo "IMZA=1" >> "$GITHUB_ENV"; echo "Sırlar tamam: imzalı derleme + TestFlight"
          else
            echo "IMZA=0" >> "$GITHUB_ENV"; echo "::notice::iOS sırları eksik; imzasız simülatör derlemesi yapılıyor (telefona kurulmaz)"
          fi
      - name: Paketler ve tip kontrolü
        run: |
          npm ci
          npx tsc --noEmit
      - name: Sürüm ve derleme numarası
        run: |
          BN=$((100 + ${{ github.run_number }}))
          node -e "const fs=require('fs');const a=require('./app.json');a.expo.ios.buildNumber='$BN';fs.writeFileSync('app.json',JSON.stringify(a,null,2))"
          echo "BN=$BN" >> "$GITHUB_ENV"; echo "VN=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_ENV"
      - name: Apple imza hazırlığı
        if: env.IMZA == '1'
        run: |
          node scripts/ios-imza.mjs "$RUNNER_TEMP/imza"
          echo "IOS_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Yerel iOS projesi (prebuild + pod install)
        run: |
          npx expo prebuild -p ios --no-install
          cd ios && pod install
      - name: Simülatör derlemesi (imzasız)
        if: env.IMZA != '1'
        run: |
          set -o pipefail
          xcodebuild -workspace ios/KankaChat.xcworkspace -scheme KankaChat -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -n 200
      - name: Anahtarlık ve profil
        if: env.IMZA == '1'
        run: |
          D="$RUNNER_TEMP/imza"; KC="$RUNNER_TEMP/kanka.keychain-db"; PW=$(openssl rand -hex 16)
          printf '%s' "$IOS_DIST_KEY" | sed 's/\\n/\n/g' > "$D/dist.key"
          openssl x509 -inform DER -in "$D/dist.cer" -out "$D/dist.pem"
          LEG=""; openssl version | grep -q "^OpenSSL 3" && LEG="-legacy"  # macOS anahtarlığı eski p12 şifrelemesini bekler
          openssl pkcs12 -export $LEG -inkey "$D/dist.key" -in "$D/dist.pem" -out "$D/dist.p12" -passout pass:"$PW" -name "Kanka Dist"
          rm -f "$D/dist.key"
          security create-keychain -p "$PW" "$KC"; security set-keychain-settings -lut 7200 "$KC"; security unlock-keychain -p "$PW" "$KC"
          security import "$D/dist.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          UUID=$(node -p "require('$D/profil.json').uuid")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$D/profil.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          security find-identity -v -p codesigning "$KC"
      - name: Arşiv ve IPA
        if: env.IMZA == '1'
        run: |
          set -o pipefail
          xcodebuild -workspace ios/KankaChat.xcworkspace -scheme KankaChat -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kanka.xcarchive" archive | tail -n 200
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.kanka.chat</key><string>$IOS_PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kanka.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/ipa" | tail -n 50
          ls -la "$RUNNER_TEMP/ipa"
      - name: TestFlight'a yükle
        if: env.IMZA == '1'
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY" | sed 's/\\n/\n/g' > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          echo "::notice::Kanka Chat $VN ($BN) TestFlight'a yüklendi. Apple işleyince (5-30 dk) TestFlight'ta görünür."
      - name: Temizlik
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/kanka.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/imza" "$HOME/.appstoreconnect" "$HOME/Library/MobileDevice/Provisioning Profiles" || true
