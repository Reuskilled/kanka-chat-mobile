name: Çökme testi (emülatör)
on:
  workflow_dispatch:
  # Her Android derlemesinden sonra yeni APK'yı emülatörde açar; çökerse iş kırmızı olur
  workflow_run:
    workflows: ['Android derleme']
    types: [completed]
jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Son AAB'yi indir, tüm işlemciler için APK üret (Play'e giden dosyanın aynısı)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=30" -q '[.[]|select(.tag_name|startswith("android-v"))]|sort_by(.created_at)|reverse|.[0].tag_name')
          echo "sürüm: $TAG"; gh release download "$TAG" -R ${{ github.repository }} -p KankaChat.aab
          curl -sSLo bundletool.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          java -jar bundletool.jar build-apks --bundle=KankaChat.aab --output=k.apks --mode=universal
          unzip -o -q k.apks universal.apk && mv universal.apk KankaChat.apk && ls -la KankaChat.apk
      - name: Emülatörde aç ve kaydı al
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r KankaChat.apk
            adb logcat -c
            adb shell monkey -p com.kanka.chat -c android.intent.category.LAUNCHER 1
            sleep 25
            if adb shell pidof com.kanka.chat; then echo "UYGULAMA AYAKTA"; else echo "UYGULAMA KAPANDI"; touch KAPANDI; fi
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d '*:E' > errors.txt || true
            adb logcat -d -s ReactNativeJS:V ReactNative:V AndroidRuntime:V > rn.txt || true
            echo "===== CRASH ====="; cat crash.txt | head -150
            echo "===== RN ====="; tail -80 rn.txt
            echo "===== E ====="; grep -iE "kanka|fatal|exception|caused by" errors.txt | head -80
            adb exec-out screencap -p > ekran.png || true
            if [ -f KAPANDI ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cokme, path: '*.txt
ekran.png' }
